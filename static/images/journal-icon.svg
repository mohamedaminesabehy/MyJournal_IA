<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#primaryGradient)" filter="url(#shadow)"/>
  
  <!-- Journal book -->
  <rect x="25" y="20" width="35" height="45" rx="3" ry="3" fill="#ffffff" opacity="0.95"/>
  <rect x="27" y="22" width="31" height="41" rx="2" ry="2" fill="#f8fafc"/>
  
  <!-- Book spine -->
  <rect x="25" y="20" width="4" height="45" rx="3" ry="3" fill="url(#accentGradient)"/>
  
  <!-- Pages lines -->
  <line x1="32" y1="30" x2="52" y2="30" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="32" y1="35" x2="50" y2="35" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="32" y1="40" x2="52" y2="40" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="32" y1="45" x2="48" y2="45" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="32" y1="50" x2="52" y2="50" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="32" y1="55" x2="46" y2="55" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- AI brain icon -->
  <circle cx="70" cy="75" r="12" fill="url(#accentGradient)" opacity="0.9"/>
  <path d="M65 72 Q70 68 75 72 Q75 78 70 80 Q65 78 65 72 Z" fill="#ffffff" opacity="0.9"/>
  <circle cx="67" cy="74" r="1.5" fill="#ffffff"/>
  <circle cx="73" cy="74" r="1.5" fill="#ffffff"/>
  <path d="M68 77 Q70 78 72 77" stroke="#ffffff" stroke-width="1" fill="none"/>
  
  <!-- Sparkle effects -->
  <circle cx="35" cy="15" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="75" cy="25" r="1" fill="#f59e0b" opacity="0.6"/>
  <circle cx="20" cy="40" r="1" fill="#06b6d4" opacity="0.7"/>
  <circle cx="80" cy="55" r="1.5" fill="#10b981" opacity="0.8"/>
</svg>